# Perform release of Che Docs

name: Release Che Docs
run-name: Release Che Docs ${{ inputs.version }} on ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version that is going to be released. Should be in format 7.y.z'
        required: true
        default: ''
      forceRecreateTags:
        description: If true, tags will be recreated. Use with caution
        required: false
        default: 'false'
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Display release parameters
        env:
          VERSION: ${{ inputs.version }}
          FORCE_RECREATE_TAGS: ${{ inputs.forceRecreateTags }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          echo "=== Release Parameters ==="
          echo "Version: ${VERSION}"
          echo "Force recreate tags: ${FORCE_RECREATE_TAGS}"
          echo "Branch: ${REF_NAME}"
          echo "Commit SHA: ${COMMIT_SHA}"
          echo "Triggered by: ${TRIGGERED_BY}"
          echo "=========================="

          # Validate version format
          [[ "${VERSION}" =~ ^7\.[0-9]+\.[0-9]+$ ]] || { echo "[ERROR] Invalid version: ${VERSION}"; exit 1; }
      - name: Check existing tags
        env:
          VERSION: ${{ inputs.version }}
          FORCE_RECREATE_TAGS: ${{ inputs.forceRecreateTags }}
        run: |
          set +e
          git ls-remote --exit-code origin refs/tags/${VERSION}
          TAG_EXISTS=$?
          if [[ $TAG_EXISTS -eq 0 ]]; then
            if [[ $FORCE_RECREATE_TAGS == "true" ]]; then
              echo "[INFO] Recreating tags for ${VERSION} version"
              git push origin :${VERSION}
            else
              echo "[ERROR] Cannot proceed with release - tag already exists"
              exit 1
            fi
          fi
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.9
      - name: Set up yq
        run: |
          python -m pip install --upgrade pip
          pip install yq
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.CHE_BOT_GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git config --global user.name "Mykhailo Kuznietsov"
          git config --global user.email "mkuznets@redhat.com"
          export GITHUB_TOKEN="${GH_TOKEN}"
          /bin/bash make-release.sh --version "${VERSION}" --trigger-release
      - name: Publish release image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git checkout "${VERSION}"
          SHORT_SHA1=$(git rev-parse --short=7 HEAD)
          docker buildx build --platform linux/amd64 -f Containerfile --push -t quay.io/eclipse/che-docs:${SHORT_SHA1} -t quay.io/eclipse/che-docs:${VERSION} .
